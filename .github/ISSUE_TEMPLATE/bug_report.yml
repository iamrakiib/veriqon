name: Bug report
description: Report a reproducible problem using synthetic data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, API keys, cookies or personal documents. Report security issues privately using SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic document if relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, local/cloud deployment and commit if known.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
