name: veriqon-integration
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: veriqon_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: veriqon_test
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U veriqon_test -d veriqon_test']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
